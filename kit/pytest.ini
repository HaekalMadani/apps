[pytest]
; Anchors rootdir for the trace-kit test suite. Run from kit/:
;   conda activate ac_dev
;   pytest -q
testpaths = tests
; makes `import trace_kit` work without installing the package
pythonpath = .
; LuaJIT (via lupa) uses SEH exception 0xe24c4a02 internally for error
; unwinding even when the error is caught by pcall; pytest's faulthandler
; prints a scary-but-harmless "Windows fatal exception" dump for each one.
addopts = -p no:faulthandler
