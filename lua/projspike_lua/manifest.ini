[ABOUT]
NAME = projspike lua
AUTHOR = spike
VERSION = 1.0
DESCRIPTION = Throwaway world-anchored marker spike (CSP Lua render API)

[CORE]
LAZY = 0

[WINDOW_...]
ID = main
NAME = projspike lua
FUNCTION_MAIN = windowMain
SIZE = 320, 240

; The 3D render callback. CSP calls this in the transparent scene pass, so
; anything drawn with render.* in world coordinates is projected by the real
; in-game camera (frame-perfect) and depth-tested against track geometry.
[RENDER_CALLBACKS]
TRANSPARENT = draw3d
