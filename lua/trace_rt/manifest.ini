[ABOUT]
NAME = TRACE
AUTHOR = Haekal Damar
VERSION = 0.4.0
DESCRIPTION = Telemetry-driven Reversible Adaptive Cue Engine - in-game runtime (M5: 20 Hz sampler/logger + session manifest + corner-pass tracking + annotator + per-pair reference loading + per-pass evaluator, fading controller and fade-event log + all three UI elements with full/reduced/hidden salience staging)

[CORE]
LAZY = 0

[RENDER_CALLBACKS]
; CSP calls draw3d() in the transparent scene pass, where render.* draws in 3D
; world space and the engine projects with the real scene camera (the approach
; the projspike_lua spike settled). This is what puts the braking and apex
; markers at their extracted world coordinates.
TRANSPARENT = draw3d

[WINDOW_...]
ID = main
NAME = TRACE
FUNCTION_MAIN = windowMain
SIZE = 460, 420

; The corner-speed indicator (M5) - framing v6's third UI element, and the only
; participant-facing window. Separate from `main` on purpose: the panel above is
; the experimenter's and must never be on the participant's screen, while this
; one is a study stimulus and must be. The experimenter positions it once, near
; centre-bottom per impl plan section 7; AC persists app window positions and the
; apparatus fixes the display and seating across participants.
[WINDOW_...]
ID = cue
NAME = TRACE cue
FUNCTION_MAIN = windowCue
SIZE = 150, 96
