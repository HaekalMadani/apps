[ABOUT]
NAME = TRACE
AUTHOR = Haekal Damar
VERSION = 0.4.0
DESCRIPTION = Telemetry-driven Reversible Adaptive Cue Engine - in-game runtime (M5: 20 Hz sampler/logger + session manifest + corner-pass tracking + annotator + per-pair reference loading + per-pass evaluator, fading controller and fade-event log + all three UI elements with full/reduced/hidden salience staging)

[CORE]
LAZY = 0

[RENDER_CALLBACKS]
; CSP calls draw3d() in the transparent scene pass, where render.* draws in 3D
; world space and the engine projects with the real scene camera (the approach
; the projspike_lua spike settled). This is what puts the braking and apex
; markers at their extracted world coordinates.
TRANSPARENT = draw3d

[UI_CALLBACKS]
; CSP calls hudOverlay() once per frame for the in-game UI, with no window
; around it: ui.* draws at absolute screen coordinates, so this is where a HUD
; element belongs. It is how the corner-speed readout and the bandwidth-KR
; message reach the participant's screen as part of the HUD rather than as an
; app window (see trace_rt.lua's overlay section for why the window was the
; wrong choice, and lib/hud.layout for the geometry).
;
; Unlike TRANSPARENT above, this section is not in the ac_apps SDK reference --
; it is taken from CSP's own Mumble app's manifest, which uses it for the
; talking-users overlay. So it was VERIFIED BY EXAMPLE rather than by
; documentation, and then **confirmed in game by the 2026-10-15 protocol dry
; run**: the callback fires and the readout draws. The `cue` app window that
; stood as the fallback for that confirmation is deleted (see below). The
; panel still reports whether the callback has ever fired, which is now a
; regression check rather than a question.
IN_GAME = hudOverlay

[WINDOW_...]
ID = main
NAME = TRACE
FUNCTION_MAIN = windowMain
SIZE = 460, 420

; The `cue` app window was DELETED on 2026-10-15, once the [UI_CALLBACKS]
; overlay above was confirmed drawing in game by the protocol dry run. It had
; been kept only as the fallback for exactly that confirmation. Two draw paths
; for one stimulus is one too many: with both live a participant sees the
; readout twice. See trace_rt.lua's corner-speed section for what the window
; was and why an app window was the wrong surface for a stimulus.
